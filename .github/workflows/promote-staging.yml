name: Promote to Staging

# Stubbed ahead of the RLS-verification gate (a later brief): this
# workflow only does the link+push, with no automated check that Test/QA
# is actually safe to promote yet. Until that gate lands, the real
# safety mechanism is manual — only trigger this after reviewing Test/QA
# yourself, and once the `staging` Environment has required reviewers,
# that approval step on this dispatch *is* the human-approval gate.
on:
  workflow_dispatch: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          # --remote is load-bearing: CLI 3.x made `db push` default to the
          # local stack, so without it this tries to reach 127.0.0.1:54322 on
          # the runner and fails with ECONNREFUSED rather than touching the
          # linked project. Older CLIs defaulted to remote, which is why this
          # workflow had never succeeded.
          supabase db push --remote
