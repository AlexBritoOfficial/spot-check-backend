name: Promote to Staging

# Stubbed ahead of the RLS-verification gate (a later brief): this
# workflow only does the link+push, with no automated check that Test/QA
# is actually safe to promote yet. Until that gate lands, the real
# safety mechanism is manual — only trigger this after reviewing Test/QA
# yourself, and once the `staging` Environment has required reviewers,
# that approval step on this dispatch *is* the human-approval gate.
on:
  workflow_dispatch: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ -z "$SUPABASE_POOLER_URL" ]; then
            echo "::error::SUPABASE_POOLER_URL is not set for this environment."
            echo "Project Settings -> Database -> Connection string -> Session pooler."
            exit 1
          fi

          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

          # Pushed through the session pooler, not the linked project's direct
          # connection: db.<ref>.supabase.co resolves to IPv6 only, and GitHub
          # runners have no IPv6, so a bare --remote dies with "IPv6 is not
          # supported on your current network". The session pooler is IPv4 on
          # 5432. Session mode specifically -- transaction mode (6543) can't
          # run everything migrations need.
          #
          # --yes because db push prompts for confirmation against a hosted
          # database, and there is no one here to answer it.
          supabase db push --remote="$SUPABASE_POOLER_URL" --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # After the migrations, never before: the functions read columns that
          # 20261124120006 adds, and a function deployed against the old schema
          # would 500 on its first call.
          #
          # Per-function settings come from supabase/config.toml, which is why
          # there is no --no-verify-jwt here -- [functions.stripe-webhook]
          # turns it off for that one function only.
          # --remote=<ref> rather than --project-ref, which still works in
          # CLI 3.x but warns that it is removed in v4. setup-cli pulls
          # `latest`, so that removal would arrive on its own schedule --
          # the same way the db push default flipped under PR #2.
          #
          # Passed explicitly rather than relying on the `link` in the previous
          # step, so this does not depend on supabase/.temp surviving between
          # steps. Add --use-api to bundle server-side if Docker on the runner
          # ever becomes a problem.
          # --yes for the same reason db push needs it: deploying to a hosted
          # project prompts for confirmation, and a runner has no terminal to
          # answer with. Without it the step fails with "Confirmation required
          # ... Nothing was changed" -- which is exactly how this was found, on
          # the first run that got far enough to reach it.
          supabase functions deploy --remote="${{ secrets.SUPABASE_PROJECT_REF }}" --yes

          # Deliberately NOT setting STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
          # here. The deploy token's Edge Function Secrets scope is None on
          # purpose, so CI can ship function code but can never read or write a
          # live secret key. Those are set once, by hand:
          #
          #   supabase secrets set STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=...
          #
          # A missing one surfaces as a loud startup error from
          # functions/_shared/stripe.ts rather than a silent misconfiguration.
