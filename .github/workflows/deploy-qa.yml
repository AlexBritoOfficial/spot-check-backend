name: Deploy to Test/QA

# Local → Test/QA is the disposable, no-gate rung of the environment
# ladder — every push to main applies cleanly or the job fails loudly.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ -z "$SUPABASE_POOLER_URL" ]; then
            echo "::error::SUPABASE_POOLER_URL is not set for this environment."
            echo "Project Settings -> Database -> Connection string -> Session pooler."
            exit 1
          fi

          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

          # Pushed through the session pooler, not the linked project's direct
          # connection: db.<ref>.supabase.co resolves to IPv6 only, and GitHub
          # runners have no IPv6, so a bare --remote dies with "IPv6 is not
          # supported on your current network". The session pooler is IPv4 on
          # 5432. Session mode specifically -- transaction mode (6543) can't
          # run everything migrations need.
          #
          # --yes because db push prompts for confirmation against a hosted
          # database, and there is no one here to answer it.
          supabase db push --remote="$SUPABASE_POOLER_URL" --yes
