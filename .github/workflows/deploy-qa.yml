name: Deploy to Test/QA

# Local → Test/QA is the disposable, no-gate rung of the environment
# ladder — every push to main applies cleanly or the job fails loudly.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          # --remote is load-bearing: CLI 3.x made `db push` default to the
          # local stack, so without it this tries to reach 127.0.0.1:54322 on
          # the runner and fails with ECONNREFUSED rather than touching the
          # linked project. Older CLIs defaulted to remote, which is why this
          # workflow had never succeeded.
          supabase db push --remote
